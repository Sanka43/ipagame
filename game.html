<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Game Store</title>
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css?v=20260929t">
</head>
<body data-auth="required">
  <main class="wrap detail" id="app">
    <a class="back" href="./">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Store
    </a>
    <div id="content"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

  <script src="assets/common.js?v=20260929b"></script>
  <script>
    const el = document.getElementById('content');
    document.getElementById('tabbar').innerHTML = tabBarHTML();
    mountAccountButton();
    const slug = new URLSearchParams(location.search).get('slug') || '';

    const skelStat = `<div class="stat">${skelLine('60%', 10)}${skelLine('45%', 14)}</div>`;
    el.innerHTML = `<div aria-hidden="true">
        <div class="hero">
          <div class="icon wait lg"></div>
          <div class="hero-info">${skelLine('65%', 24)}${skelLine('40%')}<span class="skel" style="width:120px;height:40px;border-radius:999px;margin-top:14px"></span></div>
        </div>
        <div class="stats">${skelStat.repeat(4)}</div>
        <h2 class="section-title">${skelLine('90px', 20)}</h2>
        ${skelLine('100%')}${skelLine('95%')}${skelLine('70%')}
      </div>`;

    const dlIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';

    function dlLink(v, label, cls = 'btn') {
      return `<a class="${cls}" href="${esc(asset(v.download_url))}" rel="nofollow noopener" target="_blank" data-dl="${esc(v.version)}">${dlIcon}${esc(label)}</a>`;
    }

    // Screenshots: App Store images are resized by the URL (e.g. .../320x480bb.jpg -> .../600x0w.jpg).
    const SHOT_SIZE = /\/\d+x\d+[a-z]*\.(jpe?g|png|webp)$/i;
    const shotSrc = (u, w) => /mzstatic\.com\//.test(u) ? u.replace(SHOT_SIZE, `/${w}x0w.$1`) : asset(u);

    const allShots = it => [...(it.screenshots || []), ...(it.ipad_screenshots || [])];
    // Plain white chevron; a soft shadow (CSS) keeps it readable on bright screenshots.
    const chevron = d => `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

    // iPhone then iPad screenshots in one row, with left / right arrows to move through them.
    function shotsHTML(it) {
      const list = allShots(it);
      if (!list.length) return '';
      return `<h2 class="section-title">Preview</h2>
        <div class="shots-box">
          <button type="button" class="shots-nav prev" data-dir="-1" aria-label="Previous screenshots" hidden>${chevron('m15 18-6-6 6-6')}</button>
          <div class="shots">${list.map((u, j) =>
            `<button type="button" class="shot" data-i="${j}" aria-label="Open screenshot ${j + 1}"><img class="shot-fill" src="${esc(shotSrc(u, 600))}" alt="" loading="lazy" aria-hidden="true"><img src="${esc(shotSrc(u, 600))}" alt="" loading="lazy"></button>`).join('')}</div>
          <button type="button" class="shots-nav next" data-dir="1" aria-label="Next screenshots" hidden>${chevron('m9 18 6-6-6-6')}</button>
        </div>`;
    }

    // Full-screen viewer: swipe between the screenshots of one set.
    function openShots(list, start) {
      const dlg = document.createElement('dialog');
      dlg.className = 'shot-view';
      dlg.innerHTML = `<button type="button" class="shot-close" aria-label="Close">&times;</button>
        <div class="shot-track">${list.map(u => `<img src="${esc(shotSrc(u, 1080))}" alt="">`).join('')}</div>`;
      document.body.append(dlg);
      document.body.style.overflow = 'hidden';
      dlg.addEventListener('close', () => { dlg.remove(); document.body.style.overflow = ''; });
      dlg.addEventListener('click', e => { if (e.target.closest('.shot-close') || e.target.classList.contains('shot-track')) dlg.close(); });
      dlg.showModal();
      const track = dlg.querySelector('.shot-track');
      track.scrollLeft = track.clientWidth * start;
    }

    const chevDown = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

    function render(it) {
      document.title = it.seo?.title || it.name;
      document.getElementById('tabbar').innerHTML = tabBarHTML(it.type || 'game');
      const latest = it.versions?.[0];
      const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v" title="${esc(v)}">${esc(v || '—')}</div></div>`;

      // Version history: flat rows with dividers (App Store style), no card boxes.
      const versions = (it.versions || []).map((v, i) => `
        <div class="ver">
          <div class="ver-main">
            <div class="ver-head">
              <strong>v${esc(String(v.version).replace(/^v/i, ''))}</strong>
              ${i === 0 ? '<span class="badge">Latest</span>' : ''}
            </div>
            <div class="ver-meta">${esc([fmtDate(v.release_date), fmtSize(v.size_mb)].filter(Boolean).join(' · '))}</div>
          </div>
          ${dlLink(v, 'Download', i === 0 ? 'btn sm' : 'btn sm ghost')}
          ${v.changelog ? `<div class="ver-notes-wrap clamp">
            <p class="ver-notes">${esc(v.changelog)}</p>
            <button type="button" class="link-btn ver-more" aria-label="Show more" aria-expanded="false">${chevDown}</button>
          </div>` : ''}
        </div>`).join('');

      el.innerHTML = `
        <div class="hero">
          ${iconHTML(it, 'lg')}
          <div class="hero-info">
            <h1>${esc(it.name)}</h1>
            <div class="dev">${esc(it.developer || catLabel(it.category))}</div>
            ${latest ? dlLink(latest, 'Download') : ''}
            ${latest && !latest.download_url.includes('apps.apple.com') ? `<a class="how-install" href="install.html?from=${encodeURIComponent(it.slug)}">How to install IPA</a>` : ''}
          </div>
        </div>

        <div class="stats">
          ${stat('Version', it.latest_version)}
          ${stat('Size', fmtSize(latest?.size_mb))}
          ${it.category
            ? `<div class="stat"><div class="k">Category</div><div class="v"><a href="./?type=${encodeURIComponent(it.type || 'game')}&cat=${encodeURIComponent(it.category)}">${esc(catLabel(it.category))}</a></div></div>`
            : stat('Category', '')}
          ${stat('Requires', it.min_ios ? 'iOS ' + it.min_ios : '')}
        </div>

        ${shotsHTML(it)}

        ${it.description || it.short_description ? `
          <h2 class="section-title">About</h2>
          <div class="desc-wrap clamp">
            <p class="desc">${esc(it.description || it.short_description)}</p>
            <button type="button" class="link-btn desc-more">more</button>
          </div>` : ''}

        <h2 class="section-title">Versions <small>${it.versions?.length || 0}</small></h2>
        <div class="versions">${versions || '<p class="muted">No versions yet.</p>'}</div>
      `;

      const row = el.querySelector('.shots');
      if (row) {
        const [prev, next] = el.querySelectorAll('.shots-nav');
        // Arrows only where there is more to see in that direction.
        const syncNav = () => {
          prev.hidden = row.scrollLeft <= 4;
          next.hidden = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
        };
        row.addEventListener('scroll', syncNav, { passive: true });
        row.querySelectorAll('img').forEach(img => img.addEventListener('load', syncNav));
        addEventListener('resize', syncNav);
        syncNav();
        [prev, next].forEach(b => b.addEventListener('click', () =>
          row.scrollBy({ left: +b.dataset.dir * row.clientWidth * 0.8, behavior: 'smooth' })));
        row.addEventListener('click', e => {
          const shot = e.target.closest('.shot');
          if (shot) openShots(allShots(it), +shot.dataset.i);
        });
      }

      // Version notes: 2 lines with an arrow that opens and closes them; no button when they fit.
      el.querySelectorAll('.ver-notes-wrap').forEach(wrap => {
        const p = wrap.querySelector('.ver-notes');
        const btn = wrap.querySelector('.ver-more');
        if (p.scrollHeight <= p.clientHeight + 1) { wrap.classList.remove('clamp'); btn.remove(); return; }
        btn.addEventListener('click', () => {
          const open = wrap.classList.toggle('clamp') === false;
          wrap.classList.toggle('open', open);
          btn.setAttribute('aria-expanded', open);
          btn.setAttribute('aria-label', open ? 'Show less' : 'Show more');
        });
      });

      // About: show 5 lines with "more", like the App Store; no button when it already fits.
      const wrap = el.querySelector('.desc-wrap');
      if (wrap) {
        const p = wrap.querySelector('.desc');
        const btn = wrap.querySelector('.desc-more');
        if (p.scrollHeight <= p.clientHeight + 1) wrap.classList.remove('clamp');
        else btn.addEventListener('click', () => {
          const open = wrap.classList.toggle('clamp') === false;
          wrap.classList.toggle('open', open);
          btn.textContent = open ? 'less' : 'more';
          // Folding a long text can leave the page scrolled past it: bring the About heading back.
          if (!open && wrap.getBoundingClientRect().top < 0) wrap.previousElementSibling.scrollIntoView({ block: 'start' });
        });
      }
    }

    // Record the tap for the admin's Downloads tab (signed-in members only; the server ignores guests).
    el.addEventListener('click', e => {
      const a = e.target.closest('[data-dl]');
      if (a) api('track_download', { body: { slug, version: a.dataset.dl } }).catch(() => {});
    });

    if (!slug) {
      el.innerHTML = '<p class="empty">Game not found.</p>';
    } else {
      api('get', { params: { slug } })
        .then(r => render(r.item))
        .catch(err => { el.innerHTML = `<p class="empty">${err.status === 404 ? 'Game not found.' : esc(err.message)}</p>`; });
    }
  </script>
</body>
</html>
