<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Store Admin</title>
  <link rel="icon" href="../assets/icons/favicon.ico" sizes="any">
  <link rel="icon" href="../assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/style.css?v=20260929f">
</head>
<body>
  <!-- Login -->
  <section class="login-wrap" id="loginView" hidden>
    <form class="card login-card" id="loginForm">
      <span class="brand-mark" style="width:44px;height:44px;border-radius:12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <h1>Admin login</h1>
      <p class="muted" style="margin:0 0 18px">Manage games and users in the store.</p>
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="loginError"></p>
      <button class="btn block" type="submit">Log in</button>
    </form>
  </section>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <header class="topbar">
      <div class="wrap">
        <span class="brand"><span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4M8 10v4"/></svg>
        </span>Admin</span>
        <span class="spacer"></span>
        <a class="btn sm ghost" href="../" target="_blank">View store</a>
        <button class="btn sm ghost" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main class="wrap" style="padding-bottom:40px">
      <nav class="admin-tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" data-pane="games" aria-selected="true">Games</button>
        <button type="button" role="tab" data-pane="users" aria-selected="false">Users <span class="tab-n" id="usersCount"></span></button>
        <button type="button" role="tab" data-pane="support" aria-selected="false">Support <span class="sp-n" id="supportCount" hidden></span></button>
      </nav>

      <section id="gamesPane">
      <div class="stat-cards" id="stats"></div>

      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
        </label>
        <button class="btn" id="addBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add
        </button>
      </div>
      <div class="toolbar g-filters">
        <select class="input u-filter" id="gFilter" aria-label="Filter by type or status">
          <option value="">All</option>
          <option value="game">Games</option>
          <option value="app">Apps</option>
          <option value="published">Published</option>
          <option value="draft">Drafts</option>
          <option value="nolink">No download link</option>
        </select>
        <select class="input u-filter" id="gSource" aria-label="Filter by download source">
          <option value="">IPA &amp; App Store</option>
          <option value="ipa">IPA</option>
          <option value="store">App Store</option>
        </select>
        <select class="input u-filter" id="gCat" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
        <span class="muted g-count" id="gCount"></span>
      </div>

      <div class="admin-list" id="list">
        <div class="row skel-card" aria-hidden="true"><div class="icon sm wait"></div><div class="row-info"><span class="skel skel-line" style="width:45%;height:14px"></span><span class="skel skel-line" style="width:70%"></span></div></div>
        <div class="row skel-card" aria-hidden="true"><div class="icon sm wait"></div><div class="row-info"><span class="skel skel-line" style="width:45%;height:14px"></span><span class="skel skel-line" style="width:70%"></span></div></div>
        <div class="row skel-card" aria-hidden="true"><div class="icon sm wait"></div><div class="row-info"><span class="skel skel-line" style="width:45%;height:14px"></span><span class="skel skel-line" style="width:70%"></span></div></div>
        <div class="row skel-card" aria-hidden="true"><div class="icon sm wait"></div><div class="row-info"><span class="skel skel-line" style="width:45%;height:14px"></span><span class="skel skel-line" style="width:70%"></span></div></div>
        <div class="row skel-card" aria-hidden="true"><div class="icon sm wait"></div><div class="row-info"><span class="skel skel-line" style="width:45%;height:14px"></span><span class="skel skel-line" style="width:70%"></span></div></div>
      </div>
      </section>

      <!-- Store users -->
      <section id="usersPane" hidden>
        <div class="stat-cards" id="uStats"></div>
        <div class="toolbar">
          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="uq" type="search" placeholder="Search username or email" autocomplete="off" aria-label="Search users">
          </label>
          <select class="input u-filter" id="uFilter" aria-label="Filter users">
            <option value="">All</option>
            <option value="verified">Verified</option>
            <option value="unverified">Unverified</option>
            <option value="disabled">Disabled</option>
            <option value="new">New (7 days)</option>
          </select>
        </div>
        <div class="admin-list" id="uList"></div>
      </section>

      <!-- Support chat -->
      <section id="supportPane" hidden>
        <div class="sp" id="sp">
          <aside class="sp-list">
            <div class="toolbar">
              <label class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="spq" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
              </label>
              <select class="input u-filter" id="spFilter" aria-label="Filter chats">
                <option value="open">Open</option>
                <option value="unread">Unread</option>
                <option value="closed">Resolved</option>
                <option value="">All</option>
              </select>
            </div>
            <div class="sp-threads" id="spThreads"></div>
          </aside>
          <div class="sp-conv">
            <p class="sp-pick" id="spPick">Pick a chat to reply.</p>
            <header class="chat-head" id="spHead" hidden>
              <button type="button" class="icon-btn sp-back" id="spBack" aria-label="Back to chats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
              </button>
              <span class="u-avatar" id="spAvatar"></span>
              <div class="chat-title"><strong id="spName"></strong><span id="spEmail"></span></div>
              <button type="button" class="btn sm ghost" id="spStatus"></button>
            </header>
            <div class="chat-log" id="spLog" aria-live="polite" hidden></div>
            <form class="chat-form" id="spForm" hidden></form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Add / edit sheet -->
  <dialog class="sheet" id="editor">
    <form id="editForm" novalidate>
      <div class="sheet-head">
        <h2 id="editorTitle">Add game</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="sheet-body">
        <input type="hidden" name="id">

        <div class="icon-picker field">
          <div id="iconPreview"></div>
          <div class="field">
            <label class="label" for="f-icon">Icon (URL or upload)</label>
            <input class="input" id="f-icon" name="icon" placeholder="https://… or uploads/icons/…">
            <div>
              <label class="btn sm ghost" style="cursor:pointer">
                Upload image
                <input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
              </label>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label" for="f-name">Name *</label>
          <input class="input" id="f-name" name="name" required maxlength="120">
        </div>

        <div class="grid2">
          <div class="field">
            <label class="label" for="f-type">Type</label>
            <select class="input" id="f-type" name="type">
              <option value="game">Game</option>
              <option value="app">App</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="f-category">Category</label>
            <input class="input" id="f-category" name="category" list="categoryList" placeholder="e.g. arcade">
            <datalist id="categoryList"></datalist>
          </div>
          <div class="field">
            <label class="label" for="f-developer">Developer</label>
            <input class="input" id="f-developer" name="developer" maxlength="120">
          </div>
          <div class="field">
            <label class="label" for="f-min">Minimum iOS</label>
            <input class="input" id="f-min" name="min_ios" placeholder="e.g. 14.0" maxlength="20">
          </div>
        </div>

        <div class="field">
          <label class="label" for="f-short">Short description</label>
          <input class="input" id="f-short" name="short_description" maxlength="200" placeholder="One line shown on cards">
        </div>
        <div class="field">
          <label class="label" for="f-desc">Description</label>
          <textarea class="input" id="f-desc" name="description" rows="5"></textarea>
        </div>

        <div class="grid2">
          <div class="field">
            <label class="label" for="f-status">Status</label>
            <select class="input" id="f-status" name="status">
              <option value="published">Published</option>
              <option value="draft">Draft (hidden)</option>
              <option value="review">Review (hidden)</option>
              <option value="removed">Removed (hidden)</option>
            </select>
          </div>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" name="popular"> Popular</label>
          <label class="check"><input type="checkbox" name="editors_choice"> Editors' choice</label>
        </div>

        <div class="grid2">
          <div class="field">
            <label class="label" for="f-rating">Rating (0–5)</label>
            <input class="input" id="f-rating" name="rating_value" type="number" min="0" max="5" step="0.01" placeholder="e.g. 4.5">
          </div>
          <div class="field">
            <label class="label" for="f-rating-count">Number of ratings</label>
            <input class="input" id="f-rating-count" name="rating_count" type="number" min="0" step="1" placeholder="e.g. 1200">
          </div>
        </div>

        <h3>Screenshots</h3>
        <div class="shots-edit" data-device="screenshots">
          <div class="shots-head"><span>iPhone</span> <span class="muted shot-count"></span></div>
          <div class="shot-list"></div>
          <div class="shot-add">
            <input class="input" type="url" placeholder="Paste image URL, then Add" aria-label="iPhone screenshot URL">
            <button type="button" class="btn sm ghost" data-add-url>Add</button>
            <label class="btn sm ghost" style="cursor:pointer">Upload
              <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label>
          </div>
        </div>
        <div class="shots-edit" data-device="ipad_screenshots">
          <div class="shots-head"><span>iPad</span> <span class="muted shot-count"></span></div>
          <div class="shot-list"></div>
          <div class="shot-add">
            <input class="input" type="url" placeholder="Paste image URL, then Add" aria-label="iPad screenshot URL">
            <button type="button" class="btn sm ghost" data-add-url>Add</button>
            <label class="btn sm ghost" style="cursor:pointer">Upload
              <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label>
          </div>
        </div>

        <h3>Versions <button type="button" class="btn sm ghost" id="addVersionBtn">+ Add version</button></h3>
        <div id="versions"></div>
      </div>

      <div class="sheet-foot">
        <p class="error" id="editError" style="flex:1;margin:0"></p>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Manage user sheet -->
  <dialog class="sheet user-sheet" id="userSheet">
    <form id="userForm" novalidate>
      <div class="sheet-head">
        <h2 id="uTitle">User</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="u-head">
          <span class="u-avatar lg" id="uAvatar"></span>
          <div class="row-info">
            <div class="row-name" id="uName"></div>
            <div class="row-sub" id="uEmailLine"></div>
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label class="label" for="u-username">Username</label>
            <input class="input" id="u-username" name="username" maxlength="30" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label class="label" for="u-email">Email</label>
            <input class="input" id="u-email" name="email" type="email" maxlength="190" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="card u-facts" id="uFacts"></div>
        <div class="checks" style="margin-top:14px">
          <label class="check"><input type="checkbox" name="verified"> Email verified</label>
          <label class="check"><input type="checkbox" name="disabled"> Account disabled <span class="muted" style="font-size:13px">(can&#39;t sign in)</span></label>
        </div>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn danger" id="uDelete">Delete</button>
        <button type="button" class="btn ghost" id="uMessage">Message</button>
        <p class="error" id="uError" style="flex:1;margin:0"></p>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn" id="uSave">Save</button>
      </div>
    </form>
  </dialog>

  <script>window.API_BASE = '../';</script>
  <script src="../assets/common.js?v=20260928e"></script>
  <script src="../assets/chat.js?v=20260928e"></script>
  <script>
    const $ = s => document.querySelector(s);
    const form = $('#editForm');
    const dialog = $('#editor');
    let items = [];

    /* ---------- Auth ---------- */
    function showLogin() {
      $('#dashView').hidden = true;
      $('#loginView').hidden = false;
      $('#username').focus();
    }

    async function showDash() {
      $('#loginView').hidden = true;
      $('#dashView').hidden = false;
      showPane(PANES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'games');
      if (!usersLoaded && location.hash !== '#users') refreshUsers();
      pollChats();
      await refresh();
    }

    function handleError(err) {
      if (err.status === 401) { showLogin(); return; }
      toast(err.message, true);
    }

    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.submitter;
      btn.disabled = true;
      $('#loginError').textContent = '';
      try {
        await api('login', { body: { username: $('#username').value, password: $('#password').value } });
        $('#loginForm').reset();
        await showDash();
      } catch (err) {
        $('#loginError').textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    $('#logoutBtn').addEventListener('click', async () => {
      try { await api('logout', { body: {} }); } catch {}
      showLogin();
    });

    /* ---------- List ---------- */
    async function refresh() {
      try {
        const r = await api('list', { params: { all: 1 } });
        items = r.items;
        const cats = new Set([...Object.values(r.categories || {}).flat(), ...items.map(i => i.category).filter(Boolean)]);
        $('#categoryList').innerHTML = [...cats].sort().map(c => `<option value="${esc(c)}">`).join('');
        // Category filter: only categories that have games, keeping the current choice.
        const pick = $('#gCat').value;
        const used = [...new Set(items.map(i => i.category || ''))].sort((a, b) => catLabel(a).localeCompare(catLabel(b)));
        $('#gCat').innerHTML = '<option value="">All categories</option>' +
          used.map(c => `<option value="${esc(c || '-')}">${esc(c ? catLabel(c) : 'No category')}</option>`).join('');
        $('#gCat').value = used.includes(pick === '-' ? '' : pick) ? pick : '';
        render();
      } catch (err) { handleError(err); }
    }

    const GAME_FILTERS = {
      '': () => true,
      game: i => i.type === 'game',
      app: i => i.type === 'app',
      published: i => i.status !== 'draft',
      draft: i => i.status === 'draft',
      nolink: i => !i.download_url,
    };

    function render() {
      const count = f => items.filter(f).length;
      $('#stats').innerHTML = [
        ['Total', items.length],
        ['Games', count(i => i.type === 'game')],
        ['Apps', count(i => i.type === 'app')],
        ['Drafts', count(i => i.status === 'draft')],
      ].map(([k, n]) => `<div class="card"><div class="n">${n}</div><div class="muted" style="font-size:13px">${k}</div></div>`).join('');

      const q = $('#q').value.trim().toLowerCase();
      const kind = GAME_FILTERS[$('#gFilter').value];
      const cat = $('#gCat').value;
      const source = $('#gSource').value;
      const list = items.filter(i => kind(i) && (!source || (source === 'ipa' ? i.ipa : !i.ipa && !!i.download_url)) && (!cat || (i.category || '-') === cat) &&
        (!q || [i.name, i.developer, i.category].join(' ').toLowerCase().includes(q)));
      $('#gCount').textContent = list.length === items.length ? '' : `${list.length} of ${items.length}`;
      $('#list').innerHTML = list.length ? list.map(it => {
        const n = it.versions_count || 0;
        const meta = [it.type === 'app' ? 'App' : 'Game', it.ipa ? 'IPA' : it.download_url && 'App Store', catLabel(it.category), it.latest_version && 'v' + String(it.latest_version).replace(/^v/i, ''), `${n} version${n === 1 ? '' : 's'}`]
          .filter(Boolean).join(' · ');
        const dl = it.download_url || '';
        return `<div class="row">
          ${iconHTML(it, 'sm')}
          <div class="row-info">
            <div class="row-name">${esc(it.name)} ${it.status === 'draft' ? '<span class="badge draft">Draft</span>' : ''}</div>
            <div class="row-sub">${esc(meta)}</div>
            ${dl ? `<a class="row-link" href="${esc(asset(dl))}" target="_blank" rel="noopener" title="${esc(dl)}">${esc(dl.replace(/^https?:\/\//i, ''))}</a>` : '<div class="row-sub">No download link</div>'}
          </div>
          <div class="row-actions">
            <button class="btn sm ghost" data-edit="${it.id}">Edit</button>
            <button class="btn sm danger" data-del="${it.id}">Delete</button>
          </div>
        </div>`;
      }).join('') : `<p class="empty">${items.length ? 'No matches.' : 'No games yet. Tap “Add” to create one.'}</p>`;
    }

    $('#q').addEventListener('input', render);
    $('#gFilter').addEventListener('change', render);
    $('#gCat').addEventListener('change', render);
    $('#gSource').addEventListener('change', render);

    $('#list').addEventListener('click', async e => {
      const edit = e.target.closest('[data-edit]');
      const del = e.target.closest('[data-del]');
      if (edit) {
        // The list only has summary rows; load the whole game (versions, description) to edit it.
        edit.disabled = true;
        try {
          openEditor((await api('get', { params: { id: edit.dataset.edit } })).item);
        } catch (err) { handleError(err); }
        finally { edit.disabled = false; }
      }
      if (del) {
        const it = items.find(i => String(i.id) === del.dataset.del);
        if (!it || !confirm(`Delete "${it.name}"? This cannot be undone.`)) return;
        try {
          await api('delete', { body: { id: it.id } });
          toast('Deleted');
          await refresh();
        } catch (err) { handleError(err); }
      }
    });

    /* ---------- Editor ---------- */
    function updateIconPreview() {
      $('#iconPreview').innerHTML = iconHTML({ name: form.name.value || '?', icon: form.icon.value.trim() });
    }

    function addVersion(v = {}) {
      const box = document.createElement('div');
      box.className = 'card ver-edit';
      box.innerHTML = `
        <div class="ver-top"><span>Version</span>
          <button type="button" class="btn sm danger" data-remove>Remove</button></div>
        <div class="grid2">
          <div class="field"><label class="label">Version number *</label>
            <input class="input" data-k="version" value="${esc(v.version)}" placeholder="1.0.0"></div>
          <div class="field"><label class="label">Release date</label>
            <input class="input" type="date" data-k="release_date" value="${esc(v.release_date)}"></div>
          <div class="field"><label class="label">Size (MB)</label>
            <input class="input" type="number" min="0" step="0.1" data-k="size_mb" value="${esc(v.size_mb)}"></div>
        </div>
        <div class="field"><label class="label">Download URL *</label>
          <input class="input" data-k="download_url" value="${esc(v.download_url)}" placeholder="https://…/game.ipa"></div>
        <div class="field" style="margin:0"><label class="label">What's new</label>
          <textarea class="input" rows="2" data-k="changelog">${esc(v.changelog)}</textarea></div>`;
      box.querySelector('[data-remove]').addEventListener('click', () => box.remove());
      $('#versions').append(box);
      return box;
    }

    // Screenshot URLs being edited, per device, in display order.
    const shots = { screenshots: [], ipad_screenshots: [] };
    const MAX_SHOTS = 20;

    function renderShots() {
      document.querySelectorAll('.shots-edit').forEach(box => {
        const list = shots[box.dataset.device];
        box.querySelector('.shot-count').textContent = list.length ? `${list.length} / ${MAX_SHOTS}` : 'none';
        box.querySelector('.shot-list').innerHTML = list.map((u, i) => `
          <figure class="shot-item">
            <a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>
            <figcaption>
              <button type="button" class="icon-btn sm" data-move="${i}" aria-label="Move left" ${i ? '' : 'disabled'}>‹</button>
              <button type="button" class="icon-btn sm" data-drop="${i}" aria-label="Remove screenshot">✕</button>
            </figcaption>
          </figure>`).join('');
      });
    }

    function addShot(device, url) {
      const list = shots[device];
      if (list.length >= MAX_SHOTS) { toast(`Up to ${MAX_SHOTS} screenshots`); return false; }
      if (!list.includes(url)) list.push(url);
      return true;
    }

    document.querySelectorAll('.shots-edit').forEach(box => {
      const device = box.dataset.device;
      const urlInput = box.querySelector('input[type=url]');
      const addUrl = () => {
        const u = urlInput.value.trim();
        if (!u) return;
        if (!/^https?:\/\/\S+$/i.test(u)) { toast('Enter an http(s) image URL'); return; }
        if (addShot(device, u)) { urlInput.value = ''; renderShots(); }
      };
      box.querySelector('[data-add-url]').addEventListener('click', addUrl);
      urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addUrl(); } });
      box.querySelector('.shot-list').addEventListener('click', e => {
        const list = shots[device];
        const mv = e.target.closest('[data-move]'), dr = e.target.closest('[data-drop]');
        if (mv) { const i = +mv.dataset.move; [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
        else if (dr) list.splice(+dr.dataset.drop, 1);
        else return;
        renderShots();
      });
      box.querySelector('input[type=file]').addEventListener('change', async e => {
        const files = [...e.target.files];
        e.target.value = '';
        for (const file of files) {
          const fd = new FormData();
          fd.append('shot', file);
          try {
            const r = await api('upload_screenshot', { form: fd });
            if (!addShot(device, r.path)) break;
            renderShots();
          } catch (err) { handleError(err); break; }
        }
      });
    });

    function openEditor(it) {
      form.reset();
      $('#editError').textContent = '';
      $('#versions').innerHTML = '';
      $('#editorTitle').textContent = it ? 'Edit ' + it.name : 'Add game';

      const f = form.elements;
      f.id.value = it?.id ?? '';
      f.name.value = it?.name ?? '';
      f.type.value = it?.type ?? 'game';
      f.category.value = it?.category ?? '';
      f.developer.value = it?.developer ?? '';
      f.min_ios.value = it?.min_ios ?? '';
      f.icon.value = it?.icon ?? '';
      f.short_description.value = it?.short_description ?? '';
      f.description.value = it?.description ?? '';
      f.status.value = it?.status ?? 'published';
      f.popular.checked = !!it?.featured?.popular;
      f.editors_choice.checked = !!it?.featured?.editors_choice;
      f.rating_value.value = it?.rating?.value || '';
      f.rating_count.value = it?.rating?.count || '';
      shots.screenshots = [...(it?.screenshots ?? [])];
      shots.ipad_screenshots = [...(it?.ipad_screenshots ?? [])];
      renderShots();

      (it?.versions?.length ? it.versions : [{ release_date: new Date().toISOString().slice(0, 10) }]).forEach(addVersion);
      updateIconPreview();
      dialog.showModal();
      $('.sheet-body').scrollTop = 0;
    }

    function collect() {
      const f = form.elements;
      return {
        id: f.id.value || null,
        name: f.name.value,
        type: f.type.value,
        category: f.category.value,
        developer: f.developer.value,
        min_ios: f.min_ios.value,
        icon: f.icon.value.trim(),
        short_description: f.short_description.value,
        description: f.description.value,
        status: f.status.value,
        popular: f.popular.checked,
        editors_choice: f.editors_choice.checked,
        rating_value: f.rating_value.value,
        rating_count: f.rating_count.value,
        screenshots: shots.screenshots,
        ipad_screenshots: shots.ipad_screenshots,
        versions: [...document.querySelectorAll('#versions .ver-edit')].map(box => {
          const v = {};
          box.querySelectorAll('[data-k]').forEach(i => { v[i.dataset.k] = i.value.trim(); });
          return v;
        }),
      };
    }

    $('#addBtn').addEventListener('click', () => openEditor(null));
    $('#addVersionBtn').addEventListener('click', () => {
      const box = addVersion({ release_date: new Date().toISOString().slice(0, 10) });
      $('#versions').prepend(box);
      box.querySelector('[data-k="version"]').focus();
    });
    dialog.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dialog.close()));
    form.icon.addEventListener('input', updateIconPreview);
    form.name.addEventListener('input', updateIconPreview);

    $('#iconFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const fd = new FormData();
      fd.append('icon', file);
      try {
        const r = await api('upload_icon', { form: fd });
        form.icon.value = r.path;
        updateIconPreview();
        toast('Icon uploaded');
      } catch (err) { handleError(err); }
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('#saveBtn');
      btn.disabled = true;
      $('#editError').textContent = '';
      try {
        const data = collect();
        await api('save', { body: data });
        dialog.close();
        toast(data.id ? 'Saved' : 'Added');
        await refresh();
      } catch (err) {
        if (err.status === 401) { dialog.close(); showLogin(); }
        else $('#editError').textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    const PANES = ['games', 'users', 'support'];

    /* ---------- Store users ---------- */
    let users = [];
    let usersLoaded = false;
    const uForm = $('#userForm');
    const uSheet = $('#userSheet');
    const DAY = 86400000;

    function showPane(name) {
      document.querySelectorAll('.admin-tabs [data-pane]').forEach(b => b.setAttribute('aria-selected', b.dataset.pane === name));
      for (const p of PANES) $('#' + p + 'Pane').hidden = p !== name;
      history.replaceState(null, '', name === 'games' ? location.pathname : '#' + name);
      if (name === 'users' && !usersLoaded) refreshUsers();
      if (name === 'support') { pollChats(); pollConv(); }
    }
    $('.admin-tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-pane]');
      if (b) showPane(b.dataset.pane);
    });

    async function refreshUsers() {
      if (!usersLoaded) $('#uList').innerHTML = $('#list .skel-card')?.outerHTML.repeat(4) || '';
      try {
        users = (await api('admin_users')).users;
        usersLoaded = true;
        renderUsers();
      } catch (err) { handleError(err); }
    }

    // "3 Oct 2026" / "5 min ago" style dates.
    function ago(iso) {
      if (!iso) return '';
      const ms = Date.now() - new Date(iso);
      if (ms < 60000) return 'just now';
      if (ms < 3600000) return Math.floor(ms / 60000) + ' min ago';
      if (ms < DAY) return Math.floor(ms / 3600000) + ' h ago';
      if (ms < 7 * DAY) return Math.floor(ms / DAY) + ' d ago';
      return fmtDate(iso.slice(0, 10));
    }

    const isNew = u => Date.now() - new Date(u.created_at) < 7 * DAY;
    const FILTERS = {
      '': () => true,
      verified: u => u.verified_at,
      unverified: u => !u.verified_at,
      disabled: u => u.disabled_at,
      new: isNew,
    };

    function userBadges(u) {
      return (u.disabled_at ? '<span class="badge danger">Disabled</span>' : '') +
        (!u.verified_at ? '<span class="badge draft">Unverified</span>' : '');
    }

    function renderUsers() {
      const count = f => users.filter(f).length;
      $('#usersCount').textContent = users.length;
      $('#uStats').innerHTML = [
        ['Users', users.length],
        ['Verified', count(FILTERS.verified)],
        ['New this week', count(isNew)],
        ['Disabled', count(FILTERS.disabled)],
      ].map(([k, n]) => `<div class="card"><div class="n">${n}</div><div class="muted" style="font-size:13px">${k}</div></div>`).join('');

      const q = $('#uq').value.trim().toLowerCase();
      const list = users.filter(FILTERS[$('#uFilter').value])
        .filter(u => !q || (u.username + ' ' + u.email).toLowerCase().includes(q));
      $('#uList').innerHTML = list.length ? list.map(u => `<div class="row${u.disabled_at ? ' is-disabled' : ''}">
          <span class="u-avatar">${avatarHTML(u)}</span>
          <div class="row-info">
            <div class="row-name">${esc(u.username)} ${userBadges(u)}</div>
            <div class="row-sub">${esc(u.email)}</div>
            <div class="row-sub">Joined ${esc(ago(u.created_at))} · ${u.last_login_at ? 'Last sign-in ' + esc(ago(u.last_login_at)) : 'Never signed in'}</div>
          </div>
          <div class="row-actions"><button class="btn sm ghost" data-user="${u.id}">Manage</button></div>
        </div>`).join('')
        : `<p class="empty">${users.length ? 'No users match.' : 'No one has signed up yet.'}</p>`;
    }

    $('#uq').addEventListener('input', renderUsers);
    $('#uFilter').addEventListener('change', renderUsers);

    let editing = null;
    function openUser(u) {
      editing = u;
      uForm.reset();
      $('#uError').textContent = '';
      $('#uTitle').textContent = u.username;
      $('#uAvatar').innerHTML = avatarHTML(u);
      $('#uName').innerHTML = esc(u.username) + ' ' + userBadges(u);
      $('#uEmailLine').textContent = u.email;
      const f = uForm.elements;
      f.username.value = u.username;
      f.email.value = u.email;
      f.verified.checked = !!u.verified_at;
      f.disabled.checked = !!u.disabled_at;
      const when = iso => iso ? `${fmtDate(iso.slice(0, 10))} <span class="muted">(${esc(ago(iso))})</span>` : '<span class="muted">—</span>';
      $('#uFacts').innerHTML = [
        ['User ID', '#' + u.id],
        ['Joined', when(u.created_at)],
        ['Last sign-in', u.last_login_at ? when(u.last_login_at) : '<span class="muted">Never</span>'],
        ['Email verified', u.verified_at ? when(u.verified_at) : '<span class="muted">Not yet</span>'],
        ['Disabled', u.disabled_at ? when(u.disabled_at) : '<span class="muted">No</span>'],
        ['Google sign-in', u.google ? 'Linked' : '<span class="muted">No</span>'],
      ].map(([k, v]) => `<div><span class="muted">${k}</span><span>${v}</span></div>`).join('');
      uSheet.showModal();
    }

    $('#uList').addEventListener('click', e => {
      const b = e.target.closest('[data-user]');
      if (b) openUser(users.find(u => String(u.id) === b.dataset.user));
    });
    uSheet.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => uSheet.close()));

    uForm.addEventListener('submit', async e => {
      e.preventDefault();
      const f = uForm.elements;
      // Send only what changed.
      const change = { id: editing.id };
      if (f.username.value.trim() !== editing.username) change.username = f.username.value.trim();
      if (f.email.value.trim().toLowerCase() !== editing.email) change.email = f.email.value.trim();
      if (f.verified.checked !== !!editing.verified_at) change.verified = f.verified.checked;
      if (f.disabled.checked !== !!editing.disabled_at) change.disabled = f.disabled.checked;
      if (Object.keys(change).length === 1) { uSheet.close(); return; }
      if (change.disabled && !confirm(`Disable ${editing.username}? They will be signed out and can't sign in until you enable the account again.`)) return;
      $('#uSave').disabled = true;
      $('#uError').textContent = '';
      try {
        await api('admin_user_update', { body: change });
        uSheet.close();
        toast('Saved');
        await refreshUsers();
      } catch (err) {
        if (err.status === 401) { uSheet.close(); showLogin(); }
        else $('#uError').textContent = err.message;
      } finally {
        $('#uSave').disabled = false;
      }
    });

    $('#uDelete').addEventListener('click', async () => {
      if (!confirm(`Delete ${editing.username} (${editing.email})? Their account is removed for good and this cannot be undone.`)) return;
      try {
        await api('admin_user_delete', { body: { id: editing.id } });
        uSheet.close();
        toast('User deleted');
        await refreshUsers();
      } catch (err) {
        if (err.status === 401) { uSheet.close(); showLogin(); }
        else $('#uError').textContent = err.message;
      }
    });

    $('#uMessage').addEventListener('click', () => {
      uSheet.close();
      showPane('support');
      openChat(editing.id, editing);
    });

    /* ---------- Support chat ---------- */
    const sp = { chats: [], loaded: false, userId: null, messages: [], seen: 0, status: 'open', listTimer: 0, convTimer: 0, busy: false };
    const baseTitle = document.title;

    function onSupport() { return !$('#supportPane').hidden && !$('#dashView').hidden; }

    // Chat list: every 8 s while the Support tab is open, every 30 s otherwise (for the unread badge).
    async function pollChats() {
      clearTimeout(sp.listTimer);
      if ($('#dashView').hidden) return;
      if (!document.hidden) {
        try {
          sp.chats = (await api('admin_chats')).chats;
          sp.loaded = true;
          renderChats();
        } catch (err) {
          if (err.status === 401) return showLogin();
        }
      }
      sp.listTimer = setTimeout(pollChats, onSupport() ? 8000 : 30000);
    }

    function renderChats() {
      const unread = sp.chats.reduce((n, c) => n + c.unread, 0);
      $('#supportCount').hidden = !unread;
      $('#supportCount').textContent = unread;
      document.title = (unread ? `(${unread}) ` : '') + baseTitle;
      if (!sp.loaded) return;

      const q = $('#spq').value.trim().toLowerCase();
      const f = $('#spFilter').value;
      const list = sp.chats.filter(c => (f === '' || (f === 'unread' ? c.unread : c.status === f)) &&
        (!q || (c.user.username + ' ' + c.user.email + ' ' + c.last).toLowerCase().includes(q)));
      $('#spThreads').innerHTML = list.length ? list.map(c => `<button type="button" class="sp-thread${c.unread ? ' unread' : ''}${c.status === 'closed' ? ' closed' : ''}"
          data-chat="${c.user.id}" aria-current="${c.user.id === sp.userId}">
          <span class="u-avatar">${avatarHTML(c.user)}</span>
          <span class="row-info">
            <span class="row-name"><span>${esc(c.user.username)}</span><time>${esc(ago(c.last_at))}</time></span>
            <span class="row-sub">${c.last_from === 'admin' ? 'You: ' : ''}${esc(c.last)}</span>
          </span>
          ${c.unread ? `<span class="sp-n">${c.unread}</span>` : ''}
        </button>`).join('')
        : `<p class="empty">${sp.chats.length ? 'No chats here.' : 'No one has messaged support yet.'}</p>`;
    }

    $('#spq').addEventListener('input', renderChats);
    $('#spFilter').addEventListener('change', renderChats);
    $('#spThreads').addEventListener('click', e => {
      const b = e.target.closest('[data-chat]');
      if (b) openChat(Number(b.dataset.chat));
    });

    function paintHead(user) {
      $('#spAvatar').innerHTML = avatarHTML(user);
      $('#spName').textContent = user.username + (user.disabled || user.disabled_at ? ' (disabled)' : '');
      $('#spEmail').textContent = user.email;
      $('#spStatus').textContent = sp.status === 'closed' ? 'Reopen' : 'Resolve';
    }

    // `user` (optional) fills the header at once, before the chat has loaded.
    async function openChat(userId, user) {
      sp.userId = userId;
      sp.messages = [];
      sp.seen = 0;
      sp.status = 'open';
      $('#sp').classList.add('has-conv');
      $('#spPick').hidden = true;
      $('#spHead').hidden = $('#spLog').hidden = $('#spForm').hidden = false;
      $('#spLog').innerHTML = '<div class="chat-loading" role="status" aria-label="Loading"></div>';
      composer.reset();
      const known = user || sp.chats.find(c => c.user.id === userId)?.user;
      if (known) paintHead(known);
      renderChats();
      await pollConv(true);
      if (matchMedia('(hover: hover)').matches) composer.focus();
    }

    function closeChat() {
      sp.userId = null;
      clearTimeout(sp.convTimer);
      $('#sp').classList.remove('has-conv');
      $('#spPick').hidden = false;
      $('#spHead').hidden = $('#spLog').hidden = $('#spForm').hidden = true;
      renderChats();
    }
    $('#spBack').addEventListener('click', closeChat);

    // Open chat: new messages every 3 s while the Support tab is showing.
    async function pollConv(first = false) {
      clearTimeout(sp.convTimer);
      const id = sp.userId;
      if (!id || !onSupport()) return;
      if (!document.hidden && !sp.busy) {
        sp.busy = true;
        try {
          const after = sp.messages.length ? sp.messages[sp.messages.length - 1].id : 0;
          const r = await api('admin_chat', { params: { user_id: id, after } });
          if (sp.userId !== id) return;                 // switched to another chat meanwhile
          addMessages(r.messages);
          sp.seen = r.seen;
          sp.status = r.status;
          paintHead(r.user);
          chatPaint($('#spLog'), sp.messages.length ? chatLogHTML(sp.messages, 'admin', sp.seen)
            : '<p class="empty">No messages yet. Say hello!</p>', first);
          // Reading clears this chat's unread count without waiting for the next list refresh.
          const c = sp.chats.find(c => c.user.id === id);
          if (c && c.unread) { c.unread = 0; renderChats(); }
        } catch (err) {
          if (err.status === 401) return showLogin();
          if (first) toast(err.message, true);
        } finally {
          sp.busy = false;
        }
      }
      if (sp.userId === id) sp.convTimer = setTimeout(pollConv, 3000);
    }

    function addMessages(list) {
      const have = new Set(sp.messages.map(m => m.id));
      sp.messages.push(...list.filter(m => !have.has(m.id)));
      sp.messages.sort((a, b) => a.id - b.id);
    }

    $('#spForm').innerHTML = composerHTML('Reply');
    const composer = chatComposer($('#spForm'), async text => {
      const r = await api('admin_chat_send', { body: { user_id: sp.userId, body: text } });
      addMessages([r.message]);
      sp.status = 'open';                               // a new message reopens a resolved chat
      $('#spStatus').textContent = 'Resolve';
      chatPaint($('#spLog'), chatLogHTML(sp.messages, 'admin', sp.seen), true);
      pollChats();
    });

    $('#spStatus').addEventListener('click', async () => {
      const status = sp.status === 'closed' ? 'open' : 'closed';
      try {
        await api('admin_chat_status', { body: { user_id: sp.userId, status } });
        sp.status = status;
        $('#spStatus').textContent = status === 'closed' ? 'Reopen' : 'Resolve';
        toast(status === 'closed' ? 'Marked as resolved' : 'Reopened');
        pollChats();
      } catch (err) { handleError(err); }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden || $('#dashView').hidden) return;
      pollChats();
      pollConv();
    });

    /* ---------- Boot ---------- */
    api('me').then(r => r.admin ? showDash() : showLogin()).catch(showLogin);
  </script>
</body>
</html>
